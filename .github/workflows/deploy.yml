# Publishes the single-file app when a GitHub release is published (any tag
# name, e.g. v2.0.0 or A2-1.0):
#   1. builds it from the tag and attaches hci26-steering.html to the release;
#   2. publishes that same file on GitHub Pages (as index.html).
# GitHub Pages only accepts deployments from master (the github-pages
# environment rejects tags), so step 1 starts this workflow again on master
# for step 2. Step 2 can also be started by hand from the Actions tab, for a
# given tag or the latest release. Pushes to master alone change nothing that
# students see.
#
# One-time setup: Settings → Pages → Build and deployment → Source:
# "GitHub Actions".

name: Deploy

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release to publish on GitHub Pages (empty for the latest release)
        required: false

permissions:
  actions: write
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Attach the offline file to the release
        run: gh release upload "$GITHUB_REF_NAME" dist/hci26-steering.html --clobber
      - name: Publish it on GitHub Pages from master
        run: gh workflow run deploy.yml --ref "${{ github.event.repository.default_branch }}" -f tag="$GITHUB_REF_NAME"

  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download the file of the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release download $TAG --repo "$GITHUB_REPOSITORY" --pattern hci26-steering.html --dir dist
          cp dist/hci26-steering.html dist/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
